[project]
name = "MarketData-Python-SDK"
version = "0.0.1"
description = "Python SDK client for MarketData API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
pandas = [
    "pandas>=2.3.3",
]

polars = [
    "polars-lts-cpu>=1.33.1",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "freezegun>=1.5.5",
    "isort>=7.0.0",
    "pandas>=2.3.3",
    "polars-lts-cpu>=1.33.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
