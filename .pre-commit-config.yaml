# Runs on staged files only. Install once per clone: uv run pre-commit install
# Run across the whole repo on demand:          uv run pre-commit run --all-files
fail_fast: true

repos:
  - repo: local
    hooks:
      # ruff runs through uv, so these hooks use the build uv.lock pins, the one
      # the lint workflow judges pull requests with, and a ruff bump needs no
      # change here. .github/scripts/check_ruff_version.py fails the build if
      # either stops going through uv. The entry flags, file types and
      # require_serial are those of the astral-sh/ruff-pre-commit hooks.
      - id: ruff-check      # lint and import order
        name: ruff check
        entry: uv run ruff check --force-exclude
        args: [--fix]
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format     # format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

      - id: unit_tests
        name: Run unit tests
        entry: uv run pytest -n 4 --cov="marketdata"
        language: system
        pass_filenames: false
        stages: [pre-commit]
