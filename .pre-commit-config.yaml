# Runs on staged files only. Install once per clone: uv run pre-commit install
# Run across the whole repo on demand:          uv run pre-commit run --all-files
fail_fast: true

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Exactly the ruff pinned in uv.lock, which is the one the lint workflow
    # installs and judges pull requests with. A different rev here formats a
    # commit with one ruff and has CI check it with another.
    # .github/scripts/check_ruff_version.py fails the build if the two differ,
    # so bump this together with `uv lock --upgrade-package ruff`.
    rev: v0.16.6
    hooks:
      - id: ruff-check      # lint and import order
        args: [--fix]
      - id: ruff-format     # format

  - repo: local

    hooks:
      - id: unit_tests
        name: Run unit tests
        entry: uv run pytest -n 4 --cov="marketdata"
        language: system
        pass_filenames: false
        stages: [pre-commit]
