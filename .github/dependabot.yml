# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bundle all action bumps into a single PR.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for minor/patch bumps; majors stay separate PRs since they can
    # break consumers and need individual review.
    groups:
      uv-minor-patch:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
