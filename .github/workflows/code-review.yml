name: Code review

# REVIEWS RUN WHEN CI GOES GREEN, OR WHEN ASKED. Not on every push.
#
# `pull_request_target` is deliberately absent, and that is not caution left
# over from the first run. It fires on `opened` and `synchronize` -- the moment
# CI STARTS -- and the bot refuses to review a commit whose checks are still
# running. Measured: this repository's Tests take about 75 seconds and a review
# reaches that gate in 30 to 40. So a push-triggered review would find CI
# pending, skip, and nothing would bring it back. The run would report success
# while doing nothing, which is the failure hardest to notice.
#
# So the trigger is CI's COMPLETION. Both workflows are named, because the gate
# looks at every check on the commit: whichever finishes last is the one whose
# review actually proceeds, and the earlier trigger skips cheaply. A second
# trigger on the same commit skips too -- the bot does not review a head twice.
#
# `issue_comment` gives a person the last word: `@marketdata-code-review
# re-review`, or `waive <id>`, which must work without waiting for a push.
#
# `workflow_dispatch` stays for a deliberate run, with `force` to override the
# already-reviewed skip.
on:
  workflow_run:
    workflows: ["Tests", "Lint"]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
      force:
        description: >
          Review a commit that has already been reviewed. The bot skips an
          unchanged head, so without this a re-dispatch is a no-op that reports
          success.
        type: boolean
        default: false

jobs:
  review:
    # A comment only starts a review when it is addressed to the bot, so saying
    # thank you costs nothing. The reusable workflow refuses a workflow_run whose
    # conclusion is not success, and decides trust itself in `reviewbot gate`.
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '@marketdata-code-review'))
    uses: MarketData-App/code-review-bot/.github/workflows/review.yml@main
    # NOT `secrets: inherit`. That keyword only passes secrets to a reusable
    # workflow in the SAME organisation. sdk-py is owned by the MarketDataApp
    # user account and code-review-bot by the MarketData-App organisation, so
    # inherit crosses an owner boundary and delivers nothing: the call fails
    # at evaluation with "Secret CODE_REVIEW_APP_PRIVATE_KEY is required, but
    # not provided while calling", even though the secret is set on this
    # repository. Naming them explicitly works either side of the boundary.
    secrets:
      CODE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CODE_REVIEW_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # REQUIRED here. The workflow's own default is the org's self-hosted
      # runner, whose runner group is visibility=all with
      # allows_public_repositories=false. "all" means all repositories in the
      # MarketData-App ORGANISATION; sdk-py is public and lives on the
      # MarketDataApp user account, so it fails on both counts and owns no
      # runner of its own. Without this line the job queues forever with no
      # runner and nothing says why.
      runs-on: '["ubuntu-latest"]'
      force: ${{ inputs.force }}
