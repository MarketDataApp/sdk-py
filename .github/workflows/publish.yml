name: Publish to PyPI

# Two triggers:
# - `tag-and-release` calls this workflow after its own gate and tag, since a
#   release created with `GITHUB_TOKEN` starts no workflow run.
# - A release published by hand fires `release`; `resolve` and `gate` then run
#   the same checks and the suite on the tagged commit before any upload.
# No `workflow_dispatch`: it would upload to TestPyPI, where versions are
# permanent, with no gate.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: The commit to build and publish.
        required: true
        type: string
      version:
        description: The version that commit must declare, without a `v`.
        required: true
        type: string

jobs:
  # `resolve` and `gate` run only for a release published by hand.
  resolve:
    name: Resolve the tag and check what it names
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "latest"

      - name: Resolve it, and refuse what a release must not be
        id: commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Later jobs use this SHA, not the tag, which can be moved.
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "${TAG} is ${sha}"

          # The checks below mirror `validate` in tag-and-release.yml; keep them in sync.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not on main. A release is cut from a commit that was merged."
            exit 1
          fi

          # The tag is `v` plus the version, spelled the way pip serves it.
          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *)
              echo "::error::The tag ${TAG} does not start with v. A release of X.Y.Z is tagged vX.Y.Z."
              exit 1
              ;;
          esac
          uv run --no-project --quiet --with packaging --python 3.12 python - "$version" <<'PYEOF'
          import sys

          from packaging.version import InvalidVersion, Version

          asked = sys.argv[1]
          try:
              parsed = Version(asked)
          except InvalidVersion:
              sys.exit(f"::error::{asked} is not a version Python packaging can read.")
          if str(parsed) != asked:
              sys.exit(f"::error::{asked} is spelled differently from the version it means: pip would serve {parsed}.")
          if parsed.local:
              sys.exit(f"::error::{asked} carries a local version, and PyPI refuses those.")
          PYEOF

          awk -v prefix="## [${version}] - " '
            index($0, prefix) == 1 && substr($0, length(prefix) + 1) ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '^- [^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section headed ## [${version}] - YYYY-MM-DD with at least one '- ' entry."
            exit 1
          fi

  gate:
    name: The suite, on the commit being published
    needs: resolve
    if: github.event_name == 'release'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      run_integration: true
    secrets: inherit

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/marketdata-sdk-py/
    permissions:
      id-token: write
    needs: [resolve, gate]
    # Both are skipped when this workflow is called, and a skipped dependency
    # skips this job by default, so the condition lists the results that may
    # publish.
    if: >-
      ${{ !cancelled()
      && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
      && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The SHA the gate tested, from the caller or from `resolve`.
          ref: ${{ inputs.ref || needs.resolve.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Check the build carries the version this release names
        env:
          # A release published by hand names its version in the tag.
          ASKED: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          # The version in pyproject.toml is static; this is what ties it to the release.
          expected="${ASKED#v}"
          declared=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "asked for: ${expected}"
          echo "pyproject.toml declares: ${declared}"
          if [ "$declared" != "$expected" ]; then
            echo "::error::pyproject.toml declares ${declared}, and this release is ${expected}. Bump the version in a pull request before releasing."
            exit 1
          fi
          ls -l dist/
          if ! ls dist/*.whl | grep -qF "marketdata_sdk_py-${declared}-"; then
            echo "::error::No wheel in dist/ carries version ${declared}."
            exit 1
          fi

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # Lets a re-run after a failed PyPI upload skip what TestPyPI already has.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/marketdata-sdk-py/
    permissions:
      id-token: write
    # TestPyPI first: a build it rejects never reaches PyPI.
    needs: [resolve, publish-testpypi]
    if: >-
      ${{ !cancelled() && needs.publish-testpypi.result == 'success'
      && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || needs.resolve.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
