name: Publish to PyPI

# WHAT MAY START A PUBLISH. Two things, and neither of them is a person with a
# runner to spare:
#
# - `tag-and-release` calls this workflow after its gate and its tag. A release
#   that a workflow creates with `GITHUB_TOKEN` starts no other workflow run
#   (SDK requirements §17.5), so the publish is chained explicitly instead of
#   waiting for the `release` event that will never arrive.
# - A release published by hand in the web interface, which does fire the
#   event. That path is the fallback for a broken release workflow, so it
#   carries the same gates rather than trusting the person who cut it: the
#   `gate` job below runs the suite and the live suite on the tag, and the
#   commit still has to be one `main` contains. Without that, anyone who can
#   create a release could publish an unreviewed commit.
#
# `workflow_dispatch` is deliberately absent: it published to TestPyPI with no
# gate at all (#61), and a TestPyPI version is as permanent as a PyPI one.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      ref:
        description: The commit to build and publish.
        required: true
        type: string
      version:
        description: The version that commit must declare, without a `v`.
        required: true
        type: string

jobs:
  # The three jobs below exist for a release cut by hand. `tag-and-release`
  # resolved the commit, checked it and ran the suite on it before it tagged
  # anything, so when it calls this workflow they are skipped.
  resolve:
    name: Resolve the tag and check what it names
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Resolve it, and refuse what a release must not be
        id: commit
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # A tag can be moved. Resolving it once, here, is what keeps the
          # suite, the build and the upload on the same commit: every later
          # job takes this SHA rather than the name.
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "${TAG} is ${sha}"

          # The same two checks `tag-and-release` runs before it tags, because
          # this path reaches the same upload with the same credentials.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not on main. A release is cut from a commit that was merged."
            exit 1
          fi

          # The tag contract is `vX.Y.Z`, and the version is what follows
          # the `v`, spelled the way pip serves it. `tag-and-release` checks
          # this before it tags; here the tag exists already, so the check is
          # what stops the upload.
          case "$TAG" in
            v*) version="${TAG#v}" ;;
            *)
              echo "::error::The tag ${TAG} does not start with v. A release of X.Y.Z is tagged vX.Y.Z."
              exit 1
              ;;
          esac
          uv run --no-project --quiet --with packaging --python 3.12 python - "$version" <<'PYEOF'
          import sys

          from packaging.version import InvalidVersion, Version

          asked = sys.argv[1]
          try:
              parsed = Version(asked)
          except InvalidVersion:
              sys.exit(f"::error::{asked} is not a version Python packaging can read.")
          if str(parsed) != asked:
              sys.exit(f"::error::{asked} is spelled differently from the version it means: pip would serve {parsed}.")
          if parsed.local:
              sys.exit(f"::error::{asked} carries a local version, and PyPI refuses those.")
          PYEOF

          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          # Not `-s`: a section with no entries still extracts the blank
          # line under its heading.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no ## [${version}] section, or it has no entries."
            exit 1
          fi

  gate:
    name: The suite, on the commit being published
    needs: resolve
    if: github.event_name == 'release'
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      run_integration: true
    secrets: inherit

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/marketdata-sdk-py/
    permissions:
      id-token: write
    needs: [resolve, gate]
    # Both are skipped when this workflow is called, and a skipped job is not a
    # passed one for `needs`, so the condition says which results may publish.
    # A cancelled or failed one may not.
    if: >-
      ${{ !cancelled()
      && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped')
      && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A commit either way: the caller resolved one before tagging it,
          # and `resolve` above turned the release's tag into one. A bare
          # checkout would build the default branch instead.
          ref: ${{ inputs.ref || needs.resolve.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Check the build carries the version this release names
        env:
          # A release published by hand names its version in the tag.
          ASKED: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          # The version is a static string in `pyproject.toml` (hatchling), so
          # nothing else compares it with the tag: an upload of the previous
          # number is rejected by PyPI as a duplicate, and a number nobody
          # tagged is accepted and cannot be taken back (#61).
          expected="${ASKED#v}"
          declared=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "asked for: ${expected}"
          echo "pyproject.toml declares: ${declared}"
          if [ "$declared" != "$expected" ]; then
            echo "::error::pyproject.toml declares ${declared}, and this release is ${expected}. Bump the version in a pull request before releasing."
            exit 1
          fi
          ls -l dist/
          # A wheel whose name does not carry that version means the build read
          # something else, and the upload would put it on the index anyway.
          if ! ls dist/*.whl | grep -qF "marketdata_sdk_py-${declared}-"; then
            echo "::error::No wheel in dist/ carries version ${declared}."
            exit 1
          fi

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A publish that failed after this leg left these files on TestPyPI,
          # where they are as permanent as PyPI's. Without this, re-running
          # the release's publish stops here with a 400 and PyPI never gets
          # the upload it is missing. A duplicate on PyPI itself still fails
          # the run, which is what should happen.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/marketdata-sdk-py/
    permissions:
      id-token: write
    # TestPyPI first: it is the same upload against the same immutability
    # rules, so a build that fails there would have failed on PyPI, where it
    # could not be taken back.
    needs: [resolve, publish-testpypi]
    if: >-
      ${{ !cancelled() && needs.publish-testpypi.result == 'success'
      && (needs.resolve.result == 'success' || needs.resolve.result == 'skipped') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || needs.resolve.outputs.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
