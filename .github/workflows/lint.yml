name: Lint

on:
  push:
    branches: [ main, master, develop ]
  # Deliberately no branches filter: on pull_request the filter matches the
  # PR's BASE branch, so a stacked PR (based on another feature branch) would
  # get no checks at all.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    # ruff comes from uv.lock, so this job, the pre-commit hook and ./lint.sh
    # all run the same build. Installing it as `pip install "ruff>=..."` would
    # take whatever is newest that day, and a formatter release would then turn
    # every open pull request red on code nobody had touched.
    - name: Install dependencies
      run: uv sync --group dev

    - name: Verify the ruff version is declared consistently
      run: uv run python .github/scripts/check_ruff_version.py

    - name: Check linting (ruff)
      run: uv run ruff check src/ examples/ .github/scripts/

    - name: Check formatting (ruff)
      run: uv run ruff format --check src/ examples/ .github/scripts/
