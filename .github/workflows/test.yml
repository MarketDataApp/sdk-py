name: Tests

on:
  push:
    branches: [ main, master, develop ]
  # Deliberately no branches filter: on pull_request the filter matches the
  # PR's BASE branch, so a stacked PR (based on another feature branch) would
  # get no checks at all.
  pull_request:
  # Manual runs exist for the live suite: an ordinary push never triggers it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One Python version failing must not cancel the other two: the release
      # process reads all three results, and a cancelled job hides its own.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --group dev
    
    - name: Install package
      run: uv pip install -e .
    
    - name: Run tests with coverage
      run: uv run pytest -n 4 --cov="marketdata" --cov-report=term --cov-report=xml
    
    - name: Verify coverage file exists
      run: |
        if [ ! -f coverage.xml ]; then
          echo "Error: coverage.xml not found!"
          exit 1
        fi
        echo "Coverage file found:"
        ls -lh coverage.xml
    
    # Coverage reporting is optional (SDK requirements 17.3): a missing
    # CODECOV_TOKEN must not fail the job. Runs triggered by Dependabot (and by
    # forks) never receive repository secrets, so with fail_ci_if_error the
    # upload step turned every dependency update red while the suite passed.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-python-${{ matrix.python-version }}
        fail_ci_if_error: false
        verbose: true

  integration:
    name: Integration Tests (live)
    # SDK requirements §13: the live suite runs on every pull request (and on
    # manual dispatch), never on plain pushes. Dependabot runs cannot read
    # repository secrets, so their PRs skip this JOB: that shows as "skipped"
    # in the checks, not as a green run that tested nothing.
    if: >-
      (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Every step talks to the live API; without a cap one hung request would
    # hold the runner until the 6-hour default.
    timeout-minutes: 15
    env:
      MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # §17.3: a missing token must fail the job, never skip it. The suite's own
    # conftest fails too; this step makes the reason visible before any test.
    - name: Refuse to run without the live API token
      run: |
        if [ -z "$MARKETDATA_TOKEN" ]; then
          echo "::error::MARKETDATA_TOKEN secret is missing; the live integration suite fails rather than skips (SDK requirements 17.3)."
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --group dev

    - name: Install package
      run: uv pip install -e .

    - name: Run the live integration suite
      run: uv run pytest src/tests/integration -m integration -p no:cacheprovider
