name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # One Python version failing must not cancel the other two: the release
      # process reads all three results, and a cancelled job hides its own.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --group dev
    
    - name: Install package
      run: uv pip install -e .
    
    - name: Run tests with coverage
      run: uv run pytest -n 4 --cov="marketdata" --cov-report=term --cov-report=xml
    
    - name: Verify coverage file exists
      run: |
        if [ ! -f coverage.xml ]; then
          echo "Error: coverage.xml not found!"
          exit 1
        fi
        echo "Coverage file found:"
        ls -lh coverage.xml
    
    # Coverage reporting is optional (SDK requirements 17.3): a missing
    # CODECOV_TOKEN must not fail the job. Runs triggered by Dependabot (and by
    # forks) never receive repository secrets, so with fail_ci_if_error the
    # upload step turned every dependency update red while the suite passed.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-python-${{ matrix.python-version }}
        fail_ci_if_error: false
        verbose: true
