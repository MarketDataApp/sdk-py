name: Tests

on:
  push:
    branches: [ main, master, develop ]
  # Deliberately no branches filter: on pull_request the filter matches the
  # PR's BASE branch, so a stacked PR (based on another feature branch) would
  # get no checks at all.
  pull_request:
  # Manual runs exist for the live suite: an ordinary push never triggers it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    # A documentation-only pull request does not need the suite below. But a
    # required status check can never be conditional -- the list is static -- and
    # a matrix job that GitHub SKIPS does not expand its name, so it reports no
    # per-combination context at all and the pull request waits forever for
    # checks that never arrive. Measured on MarketDataApp/sdk-php#95.
    #
    # So `Tests passed` at the bottom is the single context branch protection
    # requires, and this job decides whether the suite does any work.
    name: Decide whether the suite applies
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether anything but documentation changed
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Only a pull request can be documentation-only here. A push, a release
          # and a workflow_call all run the suite.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request, so running the suite."
            exit 0
          fi

          # Every path out of here that is not a confident "documentation only"
          # says true. A gate that cannot see both ends of the diff must never
          # conclude that no code changed.
          for sha in "$BASE" "$HEAD"; do
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "Cannot reach $sha, so running the suite rather than guessing."
              exit 0
            fi
          done

          # Three dots: the diff from the merge base, not from wherever the base
          # branch has moved to since.
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          # Inverted deliberately. This lists what DOCUMENTATION looks like and
          # runs the suite for everything else. Enumerating code paths instead
          # would skip the suite the first time somebody adds a source directory
          # nobody remembered to list.
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(^docs/|\.md$)'; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation only: the suite skips, and Tests passed says so."
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Something other than documentation changed: running the suite."
          fi

  test:
    needs: changes
    # `!= 'false'`, not `== 'true'`. A failed gate leaves this empty,
    # and the safe reading of empty is RUN THE SUITE.
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    strategy:
      # One Python version failing must not cancel the other two: the release
      # process reads all three results, and a cancelled job hides its own.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: uv sync --group dev
    
    - name: Install package
      run: uv pip install -e .
    
    - name: Run tests with coverage
      run: uv run pytest -n 4 --cov="marketdata" --cov-report=term --cov-report=xml
    
    - name: Verify coverage file exists
      run: |
        if [ ! -f coverage.xml ]; then
          echo "Error: coverage.xml not found!"
          exit 1
        fi
        echo "Coverage file found:"
        ls -lh coverage.xml
    
    # Coverage reporting is optional (SDK requirements 17.3): a missing
    # CODECOV_TOKEN must not fail the job. Runs triggered by Dependabot (and by
    # forks) never receive repository secrets, so with fail_ci_if_error the
    # upload step turned every dependency update red while the suite passed.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-python-${{ matrix.python-version }}
        fail_ci_if_error: false
        verbose: true

  integration:
    name: Integration Tests (live)
    # SDK requirements §13: the live suite runs on every pull request (and on
    # manual dispatch), never on plain pushes. Dependabot runs cannot read
    # repository secrets, so their PRs skip this JOB: that shows as "skipped"
    # in the checks, not as a green run that tested nothing.
    #
    # The documentation gate is ANDed on, so a pull request that changes only
    # markdown does not spend live API quota. The existing clauses are
    # parenthesised because the gate applies to all of them, and it reads
    # `!= 'false'` so a failed gate still runs the suite.
    needs: changes
    if: >-
      ((github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    # Every step talks to the live API; without a cap one hung request would
    # hold the runner until the 6-hour default.
    timeout-minutes: 15
    env:
      MARKETDATA_TOKEN: ${{ secrets.MARKETDATA_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # §17.3: a missing token must fail the job, never skip it. The suite's own
    # conftest fails too; this step makes the reason visible before any test.
    - name: Refuse to run without the live API token
      run: |
        if [ -z "$MARKETDATA_TOKEN" ]; then
          echo "::error::MARKETDATA_TOKEN secret is missing; the live integration suite fails rather than skips (SDK requirements 17.3)."
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --group dev

    - name: Install package
      run: uv pip install -e .

    - name: Run the live integration suite
      run: uv run pytest src/tests/integration -m integration -p no:cacheprovider

  tests-passed:
    # The single context branch protection requires. It always reports, so it is
    # always a decision rather than a silence.
    name: Tests passed
    needs: [changes, test, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require the suite to have passed, or to have been skipped for cause
        env:
          CODE: ${{ needs.changes.outputs.code }}
          R0: ${{ needs.test.result }}
          R1: ${{ needs.integration.result }}
        run: |
          echo "gate said code=${CODE:-<nothing: the gate itself failed>}"
          echo "test: ${R0}"
          echo "integration: ${R1}"

          # Two classes of job, because they skip for different reasons.
          #
          # STRICT jobs apply to every change, so the only acceptable skip is the
          # one this workflow's gate asked for. If the gate failed, CODE is empty,
          # the job skipped for some other reason, and a green here would cover
          # untested code.
          for result in "${R0}"; do
            case "$result" in
              success) ;;
              skipped)
                if [ "$CODE" != "false" ]; then
                  echo "A required job was skipped and the gate did not ask for it."
                  exit 1
                fi
                ;;
              *) echo "A required job reported: $result"; exit 1 ;;
            esac
          done

          # LENIENT jobs carry conditions of their own that predate this gate: the
          # live suite does not run on an ordinary push, and it does not run for
          # dependabot, which cannot read the token. Branch protection already
          # treats those skips as passing, so this must too. A FAILURE still
          # fails.
          for result in "${R1}"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A conditional job reported: $result"; exit 1 ;;
            esac
          done
          echo "Every job passed, or skipped for a reason this gate accepts."
